<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Broadcast Archive | Koyoungbae SSD</title><style>
:root{--page:#f8fbfd;--sky:#eaf5fc;--blue:#649cc2;--ink:#344c5d;--muted:#8294a1;--line:#e2ebf1}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:'Jeju Gothic',Arial,sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}.page{width:min(100% - 30px,980px);margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:25px 0;border-bottom:1px solid var(--line)}.logo{font:700 23px Georgia,serif}.small{font-size:11px;color:var(--blue);letter-spacing:1px}.back{color:var(--blue);font-size:12px}.intro{padding:35px 0 22px}.intro h1{font:normal clamp(30px,6vw,48px) Georgia,serif;margin:4px 0}.intro p{color:var(--muted);font-size:13px}.toolbar{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;padding:14px;background:white;border:1px solid var(--line);border-radius:14px}.toolbar input,.toolbar select{min-width:0;width:100%;padding:11px 9px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);font:inherit;font-size:12px}.count{font-size:12px;color:var(--muted);margin:18px 0 12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}.thumb{display:block;aspect-ratio:16/9;background:var(--sky);position:relative}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#344c5dcc;color:white;border-radius:50%;padding:9px 15px;font-size:20px}.content{padding:11px}.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.pill{background:var(--sky);border-radius:30px;padding:3px 9px;color:#527f9f}.content h2{font-size:13px;margin:8px 0 5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}.desc{font-size:11px;color:#637b8c;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tags{display:flex;gap:4px;flex-wrap:wrap;margin:7px 0}.tag{font-size:10px;background:#f0f7fb;color:#648da8;border-radius:30px;padding:3px 8px}details{border-top:1px solid var(--line);margin-top:9px;padding-top:9px}summary{cursor:pointer;color:#527f9f;font-size:12px;font-weight:700}.scene{padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}.scene:last-child{border-bottom:0}.scene a{color:#527f9f;font-weight:700;background:var(--sky);border-radius:6px;padding:5px 7px;display:inline-block;margin-right:6px}.scene .memo{color:var(--muted);margin-top:5px}.empty{text-align:center;color:var(--muted);padding:45px 10px}.notice{font-size:11px;color:var(--muted);margin:25px 0}footer{text-align:center;font-size:10px;color:var(--muted);padding:25px 0}@media(max-width:750px){.toolbar{grid-template-columns:repeat(4,1fr)}.toolbar input{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.content{padding:9px}.content h2{font-size:12px}.desc{font-size:10px}.meta{font-size:10px}}@media(max-width:430px){.toolbar{grid-template-columns:repeat(2,1fr)}.toolbar input{grid-column:1/-1}}
</style></head><body><div class="page"><header><div><div class="logo">Koyoungbae SSD</div><div class="small">YOUNGBAE ARCHIVE</div></div><a class="back" href="index.html">← HOME</a></header><section class="intro"><div class="small">ARCHIVE No. 1208</div><h1>Broadcast Archive</h1><p>고란의 소영배 · 영상과 장면의 기록</p></section><div class="toolbar"><input id="search" placeholder="제목 · 설명 · 태그 · 장면 메모 검색" aria-label="통합 검색"><select id="year"><option value="">전체 연도</option></select><select id="month"><option value="">전체 월</option></select><select id="day"><option value="">전체 일</option></select><select id="type"><option value="">전체 종류</option><option value="LIVE">LIVE</option><option value="CLIP">CLIP</option></select></div><div class="count" id="count">영상 목록 불러오는 중...</div><main id="cards" class="grid"></main><p class="notice">※ 영상 썸네일을 누르면 유튜브 원본으로 이동합니다. 장면 시간을 누르면 해당 시점부터 재생됩니다.</p><footer>KOYOUNGBAE SSD · MADE WITH CARE</footer></div><script>
const $=id=>document.getElementById(id),cards=$('cards');let videos=[],notes={},scenes={};const make=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};function csvParse(s){s=s.replace(/^\uFEFF/,'');let rows=[],row=[],field='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){field+='"';i++}else if(c==='"')q=false;else field+=c}else if(c==='"')q=true;else if(c===','){row.push(field);field=''}else if(c==='\r'||c==='\n'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x.trim()))rows.push(row);const head=rows.shift()?.map(x=>x.trim())||[];return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||'').trim()]))) }function videoId(url){try{const u=new URL(url);const h=u.hostname.toLowerCase();if(h==='youtu.be'||h==='www.youtu.be')return u.pathname.split('/')[1]||'';if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com'].includes(h)){if(u.pathname==='/watch')return u.searchParams.get('v')||'';if(/^\/(shorts|live|embed)\//.test(u.pathname))return u.pathname.split('/')[2]||''}}catch(e){}return ''}function seconds(s){const a=s.split(':').map(Number);if(!a.length||a.length>3||a.some(n=>!Number.isInteger(n)||n<0))return null;return a.reduce((v,n)=>v*60+n,0)}function linkAt(url,time){try{const u=new URL(url);if(!['youtube.com','www.youtube.com','m.youtube.com','youtu.be','www.youtu.be'].includes(u.hostname))return url;const t=seconds(time);if(t!==null)u.searchParams.set('t',String(t));return u.href}catch(e){return url}}function render(){const q=$('search').value.trim().toLocaleLowerCase('ko'),year=$('year').value,month=$('month').value,day=$('day').value,type=$('type').value;const filtered=videos.filter(v=>{const n=notes[v.id]||{},ss=scenes[v.id]||[];const hay=[v.title,v.description,n.description,n.tags,...ss.flatMap(s=>[s.title,s.memo,s.tags,s.time])].join(' ').toLocaleLowerCase('ko');return(!year||v.date.slice(0,4)===year)&&(!month||v.date.slice(5,7)===month)&&(!day||v.date.slice(8,10)===day)&&(!type||v.type.toUpperCase()===type)&&(!q||hay.includes(q))});$('count').textContent=`전체 ${videos.length}개 · 표시 ${filtered.length}개`;cards.replaceChildren();if(!filtered.length){cards.append(make('div','empty','조건에 맞는 영상이 없어요.'));return}for(const v of filtered){const n=notes[v.id]||{},ss=scenes[v.id]||[],vid=videoId(v.url),card=make('article','card'),thumb=make('a','thumb');thumb.href=v.url;thumb.target='_blank';thumb.rel='noopener noreferrer';thumb.setAttribute('aria-label',v.title+' 유튜브에서 보기');if(vid){const img=make('img');img.src=`https://i.ytimg.com/vi/${encodeURIComponent(vid)}/hqdefault.jpg`;img.alt=v.title+' 썸네일';img.loading='lazy';thumb.append(img)}else{thumb.append(make('span','play','▶'))}card.append(thumb);const c=make('div','content'),meta=make('div','meta');meta.append(make('span','pill',v.type.toUpperCase()));meta.append(make('span','',v.date));if(n.visibility&&n.visibility!=='PUBLIC')meta.append(make('span','pill',n.visibility));c.append(meta);const title=make('h2','',v.title);c.append(title);const d=n.description||v.description;if(d)c.append(make('p','desc',d));if(n.tags){const tags=make('div','tags');for(const t of n.tags.split('|').filter(Boolean))tags.append(make('span','tag','#'+t));c.append(tags)}const details=make('details'),summary=make('summary','',`장면 기록 ${ss.length}개 펼치기`);details.append(summary);if(!ss.length)details.append(make('p','desc','아직 기록된 장면이 없어요.'));for(const s of ss){const row=make('div','scene'),a=make('a','',s.time);a.href=linkAt(v.url,s.time);a.target='_blank';a.rel='noopener noreferrer';row.append(a,make('strong','',s.title));if(s.memo)row.append(make('div','memo',s.memo));details.append(row)}c.append(details);card.append(c);cards.append(card)}}async function load(){try{const [v,n,s]=await Promise.all(['broadcast.csv','broadcast-notes.csv','scenes.csv'].map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw Error(f+' 파일을 찾지 못했어요');return csvParse(await r.text())}));videos=v.filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&x.url&&x.id).sort((a,b)=>b.date.localeCompare(a.date));notes=Object.fromEntries(n.filter(x=>x.id).map(x=>[x.id,x]));scenes={};for(const x of s){if(!x.id)continue;(scenes[x.id]??=[]).push(x)}for(const arr of Object.values(scenes))arr.sort((a,b)=>(seconds(a.time)??0)-(seconds(b.time)??0));for(const y of [...new Set(videos.map(x=>x.date.slice(0,4)))].sort().reverse()){const o=make('option','',y+'년');o.value=y;$('year').append(o)}for(let i=1;i<=12;i++){const x=String(i).padStart(2,'0'),o=make('option','',i+'월');o.value=x;$('month').append(o)}for(let i=1;i<=31;i++){const x=String(i).padStart(2,'0'),o=make('option','',i+'일');o.value=x;$('day').append(o)}render()}catch(e){$('count').textContent='목록을 불러오지 못했어요.';cards.replaceChildren(make('div','empty',e.message+' · HTML과 CSV 3개를 같은 폴더에 업로드해 주세요.'))}}for(const id of ['search','year','month','day','type'])$(id).addEventListener(id==='search'?'input':'change',render);load();
</script></body></html>
