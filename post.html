
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POST ARCHIVE | 고영배의 외장하드</title>
  <style>
    :root {
      --bg: #f7f9ff;
      --white: #ffffff;
      --ink: #26334f;
      --muted: #8792a9;
      --blue: #4774db;
      --light-blue: #eaf0ff;
      --border: #e4eaf5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans KR", sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .topbar {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 18px max(22px, calc((100% - 1080px)/2));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand { font-weight: 800; letter-spacing: .04em; }
    .nav { display: flex; gap: 18px; flex-wrap: wrap; }
    .nav a { font-size: 13px; color: var(--muted); }
    .nav a.active { color: var(--blue); font-weight: 800; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 20px 80px; }
    .eyebrow {
      font-size: 12px;
      letter-spacing: .2em;
      color: var(--blue);
      font-weight: 800;
    }
    h1 { margin: 12px 0 8px; font-size: clamp(30px, 5vw, 48px); }
    .subtitle { color: var(--muted); font-size: 14px; }
    .panel {
      margin-top: 34px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 12px 36px rgba(58,83,143,.05);
    }
    .platforms {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }
    .platform {
      border: 0;
      background: transparent;
      padding: 11px 17px;
      border-radius: 12px;
      color: var(--muted);
      font-weight: 700;
    }
    .platform.active { background: var(--light-blue); color: var(--blue); }
    .section-label { font-size: 13px; font-weight: 800; margin: 24px 0 12px; }
    .accounts { display: flex; flex-wrap: wrap; gap: 9px; }
    .account {
      border: 1px solid var(--border);
      background: white;
      border-radius: 100px;
      padding: 11px 18px;
      color: #687792;
      transition: .2s;
    }
    .account:hover { border-color: var(--blue); color: var(--blue); }
    .account.active {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
      font-weight: 800;
      box-shadow: 0 5px 14px rgba(71,116,219,.2);
    }
    .filters { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; margin-top: 24px; }
    .search, .filter {
      border: 1px solid var(--border);
      background: white;
      border-radius: 12px;
      padding: 13px 14px;
      min-width: 0;
      outline: none;
    }
    .search:focus, .filter:focus { border-color: var(--blue); }
    .date-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    .date-row label { color: var(--muted); font-size: 12px; }
    .date-row input {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px;
      color: var(--ink);
    }
    .results-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 30px 0 14px; }
    .count { font-size: 13px; color: var(--muted); }
    .view-buttons { display: flex; gap: 5px; }
    .view-btn {
      border: 1px solid var(--border);
      background: white;
      border-radius: 9px;
      padding: 9px 13px;
      color: var(--muted);
    }
    .view-btn.active { background: var(--light-blue); color: var(--blue); border-color: #c9d8ff; }
    .posts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
    .posts.list { grid-template-columns: 1fr; }
    .post {
      background: white;
      border: 1px solid var(--border);
      border-radius: 17px;
      overflow: hidden;
    }
    .thumb {
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #edf2ff, #f8eefa);
      display: grid;
      place-items: center;
      color: #a2afd0;
      font-size: 35px;
    }
    .post-body { padding: 17px; }
    .post-account { font-size: 12px; color: var(--blue); font-weight: 800; }
    .post-date { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .post-caption { font-size: 14px; line-height: 1.6; margin: 12px 0; overflow-wrap: anywhere; }
    .post-link { font-size: 12px; color: var(--blue); font-weight: 800; }
    .posts.list .post { display: grid; grid-template-columns: 120px 1fr; }
    .posts.list .thumb { aspect-ratio: auto; min-height: 130px; }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 65px 20px;
      background: white;
      border: 1px dashed #ccd7ed;
      border-radius: 18px;
    }
    .empty-icon { font-size: 36px; }
    .empty h2 { font-size: 18px; margin: 16px 0 8px; }
    .empty p { font-size: 13px; color: var(--muted); line-height: 1.7; }
    footer { text-align: center; padding: 28px; font-size: 12px; color: var(--muted); }
    @media(max-width: 720px) {
      .wrap { padding-top: 32px; }
      .panel { padding: 18px; }
      .filters { grid-template-columns: 1fr; }
      .posts { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .nav { gap: 10px; }
    }
    @media(max-width: 450px) {
      .posts { grid-template-columns: 1fr; }
      .posts.list .post { grid-template-columns: 90px 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">💾 KOYOUNGBAE SSD</a>
    <nav class="nav">
      <a href="index.html">HOME</a>
      <a href="broadcast.html">BROADCAST</a>
      <a href="post.html" class="active">POST ARCHIVE</a>
      <a href="bubble.html">BUBBLE</a>
    </nav>
  </header>

  <main class="wrap">
    <div class="eyebrow">KOYOUNGBAE SSD · SOCIAL RECORDS</div>
    <h1>POST ARCHIVE</h1>
    <p class="subtitle">고영배의 SNS 기록을 모아보는 공간 ✦</p>

    <section class="panel">
      <div class="platforms" aria-label="플랫폼 선택">
        <button class="platform active" data-platform="instagram">Instagram</button>
        <button class="platform" data-platform="x">X</button>
        <button class="platform" data-platform="blog">Blog</button>
        <button class="platform" data-platform="cafe">Cafe</button>
      </div>

      <div id="instagramAccounts">
        <div class="section-label">계정 선택</div>
        <div class="accounts">
          <button class="account active" data-account="all">✦ 전체 계정</button>
          <button class="account" data-account="kayclef">고영배</button>
          <button class="account" data-account="band_soran">밴드 소란</button>
          <button class="account" data-account="soran_haeyo">소란해요</button>
        </div>
      </div>

      <div class="filters">
        <input id="search" class="search" placeholder="캡션이나 키워드 검색..." aria-label="키워드 검색">
        <select id="type" class="filter" aria-label="게시물 유형">
          <option value="all">전체 유형</option>
          <option value="photo">사진</option>
          <option value="reel">릴스</option>
          <option value="carousel">여러 장</option>
        </select>
        <select id="sort" class="filter" aria-label="정렬">
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
        </select>
      </div>

      <div class="date-row">
        <label for="start">시작일</label>
        <input type="date" id="start">
        <label for="end">종료일</label>
        <input type="date" id="end">
      </div>
    </section>

    <div class="results-bar">
      <span id="count" class="count">게시물 0개</span>
      <div class="view-buttons">
        <button class="view-btn active" data-view="card">▦ 카드형</button>
        <button class="view-btn" data-view="list">☷ 목록형</button>
      </div>
    </div>

    <div id="posts" class="posts"></div>
  </main>

  <footer>© KOYOUNGBAE SSD · Made with 💙</footer>

  <script>
    // 나중에 실제 게시물 데이터를 이 배열 또는 CSV와 연결할 예정
    // 데이터 예시:
    // {
    //   platform: "instagram",
    //   account: "kayclef",
    //   date: "2026-10-01",
    //   caption: "게시물 내용",
    //   type: "photo",
    //   url: "https://www.instagram.com/p/...",
    //   thumbnail: ""
    // }
    const postsData = [];

    const state = {
      platform: "instagram",
      account: "all",
      view: "card"
    };

    const postsEl = document.getElementById("posts");
    const countEl = document.getElementById("count");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function render() {
      const query = document.getElementById("search").value.trim().toLowerCase();
      const type = document.getElementById("type").value;
      const sort = document.getElementById("sort").value;
      const start = document.getElementById("start").value;
      const end = document.getElementById("end").value;

      const filtered = postsData.filter(post =>
        post.platform === state.platform &&
        (state.account === "all" || post.account === state.account) &&
        (type === "all" || post.type === type) &&
        (!start || post.date >= start) &&
        (!end || post.date <= end) &&
        (post.caption || "").toLowerCase().includes(query)
      ).sort((a, b) =>
        sort === "newest"
          ? b.date.localeCompare(a.date)
          : a.date.localeCompare(b.date)
      );

      countEl.textContent = `게시물 ${filtered.length}개`;
      postsEl.className = "posts" + (state.view === "list" ? " list" : "");

      if (!filtered.length) {
        postsEl.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🗂️</div>
            <h2>아직 표시할 게시물이 없어요</h2>
            <p>자료를 추가하면 이곳에서<br>날짜와 키워드로 찾아볼 수 있어요.</p>
          </div>`;
        return;
      }

      postsEl.innerHTML = filtered.map(post => {
        const accountName = {
          kayclef: "고영배",
          band_soran: "밴드 소란",
          soran_haeyo: "소란해요"
        }[post.account] || post.account;

        const thumbnail = post.thumbnail
          ? `<img src="${escapeHtml(post.thumbnail)}"
                  alt="" loading="lazy"
                  style="width:100%;height:100%;object-fit:cover">`
          : "📷";

        const safeUrl = /^https:\/\/(www\.)?(instagram\.com|x\.com|twitter\.com)\//i.test(post.url || "")
          ? escapeHtml(post.url) : "#";

        return `
          <article class="post">
            <div class="thumb">${thumbnail}</div>
            <div class="post-body">
              <div class="post-account">${escapeHtml(accountName)}</div>
              <div class="post-date">${escapeHtml(post.date)}</div>
              <p class="post-caption">${escapeHtml(post.caption)}</p>
              <a class="post-link" href="${safeUrl}"
                 target="_blank" rel="noopener noreferrer">
                 원본 게시물 보기 ↗
              </a>
            </div>
          </article>`;
      }).join("");
    }

    document.querySelectorAll(".platform").forEach(button => {
      button.addEventListener("click", () => {
        state.platform = button.dataset.platform;
        document.querySelectorAll(".platform").forEach(b =>
          b.classList.toggle("active", b === button)
        );
        document.getElementById("instagramAccounts").hidden =
          state.platform !== "instagram";
        state.account = "all";
        document.querySelectorAll(".account").forEach(b =>
          b.classList.toggle("active", b.dataset.account === "all")
        );
        render();
      });
    });

    document.querySelectorAll(".account").forEach(button => {
      button.addEventListener("click", () => {
        state.account = button.dataset.account;
        document.querySelectorAll(".account").forEach(b =>
          b.classList.toggle("active", b === button)
        );
        render();
      });
    });

    document.querySelectorAll(".view-btn").forEach(button => {
      button.addEventListener("click", () => {
        state.view = button.dataset.view;
        document.querySelectorAll(".view-btn").forEach(b =>
          b.classList.toggle("active", b === button)
        );
        render();
      });
    });

    ["search", "type", "sort", "start", "end"].forEach(id => {
      document.getElementById(id).addEventListener("input", render);
    });

    render();
  </script>
</body>
</html>
