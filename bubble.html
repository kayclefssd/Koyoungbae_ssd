<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Archive | Koyoungbae SSD</title>
<style>
@import url('https://fonts.googleapis.com/earlyaccess/jejugothic.css');
:root{--page:#f8fbfd;--sky:#eaf5fc;--blue:#649cc2;--ink:#344c5d;--muted:#8294a1;--line:#e2ebf1}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:'Jeju Gothic',sans-serif;line-height:1.7}a{color:inherit;text-decoration:none}.page{width:min(100% - 32px,900px);margin:auto}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:26px 0}.logo{font-family:Georgia,serif;font-size:23px;font-weight:bold}.subtitle,.eyebrow{font-size:11px;color:var(--blue);letter-spacing:1.4px}.back{font-size:12px;color:var(--blue)}.intro{padding:40px 0 24px}.intro h1{font:normal clamp(30px,6vw,48px) Georgia,serif;margin:6px 0}.intro p{font-size:13px;color:var(--muted);margin:0}.toolbar{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:16px}.toolbar input,.toolbar select{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;padding:12px;background:#fff;color:var(--ink);font:inherit;font-size:12px}.count{font-size:11px;color:var(--muted);margin:8px 0 14px}.chat{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;min-height:260px}.date{display:flex;justify-content:center;margin:22px 0 14px}.date span{background:#f1f6f9;color:var(--muted);border-radius:30px;padding:5px 14px;font-size:11px}.message{max-width:min(82%,520px);margin:12px 0;background:var(--sky);border-radius:5px 16px 16px 16px;padding:12px 14px;font-size:13px;overflow-wrap:anywhere}.message .time{display:block;text-align:right;color:#7b97a9;font-size:10px;margin-top:6px}.message img,.message video{display:block;max-width:100%;border-radius:9px;margin-top:6px}.message video{width:100%}.message audio{display:block;width:min(100%,300px);margin-top:8px}.message .kind{font-size:10px;color:#648da8;margin-bottom:4px}.empty{color:var(--muted);font-size:13px;text-align:center;padding:55px 0}.notice{font-size:11px;color:var(--muted);margin:16px 0 32px}footer{text-align:center;font-size:10px;color:var(--muted);padding:24px 0}
.poll-title{font-size:16px;font-weight:bold;margin:4px 0 14px}.poll-choice{margin:12px 0}.poll-choice-head{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-bottom:5px}.poll-track{height:10px;border-radius:999px;background:#d4e5f0;overflow:hidden}.poll-fill{height:100%;background:var(--blue);border-radius:999px}.poll-total{font-size:11px;color:var(--muted);margin-top:12px}.poll-original{font-size:11px;color:var(--blue);text-decoration:underline;display:inline-block;margin-top:8px}
.link-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #d5e5ef;border-radius:12px;padding:13px 14px;margin-top:10px;transition:border-color .2s,background .2s}.link-card:hover{border-color:var(--blue);background:#f8fcff}.link-icon{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:10px;background:#eaf5fc;color:#527f9f;font-size:17px}.link-info{min-width:0;flex:1}.link-title{font-size:12px;font-weight:bold;color:var(--ink)}.link-host{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.link-arrow{color:var(--blue);font-size:17px}.link-invalid{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:600px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.chat{padding:14px}.message{max-width:92%}}
</style>
</head>
<body>
<div class="page">
<header><div><div class="logo">Koyoungbae SSD</div><div class="subtitle">YOUNGBAE ARCHIVE</div></div><a class="back" href="index.html">← HOME</a></header>
<section class="intro"><div class="eyebrow">ARCHIVE No. 1208</div><h1>Bubble Archive</h1><p>말들이 모여 우리의 시간이 되는 곳.</p></section>
<div class="toolbar"><input id="search" type="search" placeholder="메시지 내용 검색" aria-label="메시지 검색"><select id="year" aria-label="연도 선택"><option value="">전체 연도</option></select><select id="month" aria-label="월 선택"><option value="">전체 월</option></select><select id="day" aria-label="일 선택"><option value="">전체 일</option></select></div>
<div class="count" id="count">메시지를 불러오는 중...</div><main class="chat" id="chat" aria-live="polite"></main>
<p class="notice">※ 기록은 원본을 기준으로 정리합니다. 공개 가능한 콘텐츠만 등록해 주세요.</p>
<footer>KOYOUNGBAE SSD · MADE WITH CARE</footer>
</div>
<script>
const chat=document.getElementById('chat'),search=document.getElementById('search'),year=document.getElementById('year'),month=document.getElementById('month'),day=document.getElementById('day'),count=document.getElementById('count');
let messages=[];
function make(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function mediaPath(path){const p=String(path||'').trim();if(!p)return '';if(/^(https?:)?\/\//i.test(p))return p;if(p.startsWith('/')||p.includes('..')||p.includes('\\'))return '';return p.startsWith('bubble-media/')?p:'bubble-media/'+p}
function safeLink(raw){try{const u=new URL(String(raw||'').trim());return ['https:','http:'].includes(u.protocol)?u:null}catch{return null}}
function pollOptions(m){const raw=String(m.options||'').trim();if(!raw)return [];return raw.split('|').map(item=>{const pos=item.lastIndexOf(':');if(pos<0)return null;const name=item.slice(0,pos).trim(),votes=Number(item.slice(pos+1).trim());return name&&Number.isFinite(votes)&&votes>=0?{name,votes}:null}).filter(Boolean)}
function render(){chat.replaceChildren();const q=search.value.trim().toLocaleLowerCase('ko');const items=messages.filter(m=>(!year.value||m.date.slice(0,4)===year.value)&&(!month.value||m.date.slice(5,7)===month.value)&&(!day.value||m.date.slice(8,10)===day.value)&&(!q||[m.text,m.type,m.date,m.options,m.type==='link'?m.file:''].join(' ').toLocaleLowerCase('ko').includes(q)));count.textContent=`전체 ${messages.length}개 · 표시 ${items.length}개`;if(!items.length){chat.append(make('div','empty','조건에 맞는 메시지가 없어요.'));return}let last='';for(const m of items){if(m.date!==last){const d=make('div','date');d.append(make('span','',m.date));chat.append(d);last=m.date}const b=make('article','message');if(m.type!=='text')b.append(make('div','kind',({photo:'PHOTO',video:'VIDEO',voice:'VOICE',poll:'POLL · 설문 결과',link:'LINK · 공유한 링크'})[m.type]||'MESSAGE'));if(m.type==='poll'){b.append(make('div','poll-title',m.text||'설문'));const opts=pollOptions(m);const total=opts.reduce((sum,o)=>sum+o.votes,0);for(const o of opts){const item=make('div','poll-choice'),head=make('div','poll-choice-head');head.append(make('span','',o.name),make('span','',o.votes.toLocaleString('ko-KR')+'표'));item.append(head);const track=make('div','poll-track'),fill=make('div','poll-fill');fill.style.width=(total?o.votes/total*100:0).toFixed(2)+'%';track.append(fill);item.append(track);b.append(item)}if(opts.length)b.append(make('div','poll-total','총 '+total.toLocaleString('ko-KR')+'표 · 기록된 결과'));else b.append(make('div','poll-total','설문 선택지와 득표수를 입력해 주세요.'));const original=mediaPath(m.file);if(original){const link=make('a','poll-original','원본 스크린샷 보기 ↗');link.href=original;link.target='_blank';link.rel='noopener noreferrer';b.append(link)}}else if(m.type==='link'){if(m.text)b.append(make('div','body',m.text));const url=safeLink(m.file);if(url){const card=make('a','link-card');card.href=url.href;card.target='_blank';card.rel='noopener noreferrer';card.setAttribute('aria-label',url.hostname+' 링크 새 창에서 열기');card.append(make('span','link-icon','↗'));const info=make('div','link-info');info.append(make('div','link-title','공유한 링크 열기'),make('div','link-host',url.hostname));card.append(info,make('span','link-arrow','↗'));b.append(card)}else b.append(make('div','link-invalid','링크 주소를 확인해 주세요.'))}else{if(m.text)b.append(make('div','body',m.text));const src=mediaPath(m.file);if(src&&m.type==='photo'){const img=make('img');img.src=src;img.alt=m.text||'사진 메시지';img.loading='lazy';b.append(img)}else if(src&&m.type==='video'){const v=make('video');v.src=src;v.controls=true;v.preload='metadata';b.append(v)}else if(src&&m.type==='voice'){const a=make('audio');a.src=src;a.controls=true;a.preload='none';b.append(a);b.append(make('div','kind','재생되지 않으면 영상 파일 형식을 확인해 주세요.'))}}b.append(make('span','time',m.time||''));chat.append(b)}}
function parseCSV(csv){const rows=[];let row=[],field='',quoted=false;csv=csv.replace(/^\uFEFF/,'');for(let i=0;i<csv.length;i++){const c=csv[i];if(quoted){if(c==='"'&&csv[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&csv[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x.trim()))rows.push(row);const header=rows.shift()?.map(x=>x.trim().toLowerCase())||[];return rows.map(r=>Object.fromEntries(header.map((h,i)=>[h,(r[i]||'').trim()]))) }
async function load(){try{const r=await fetch('messages.csv',{cache:'no-store'});if(!r.ok)throw Error('messages.csv 파일을 찾을 수 없어요.');messages=parseCSV(await r.text()).filter(m=>/^\d{4}-\d{2}-\d{2}$/.test(m.date||'')).map(m=>({...m,type:(m.type||'text').toLowerCase()})).sort((a,b)=>(b.date+' '+(b.time||'')).localeCompare(a.date+' '+(a.time||'')));const years=[...new Set(messages.map(m=>m.date.slice(0,4)))].sort().reverse();for(const y of years){const o=make('option','',y+'년');o.value=y;year.append(o)}for(let i=1;i<=12;i++){const n=String(i).padStart(2,'0');const o=make('option','',i+'월');o.value=n;month.append(o)}for(let i=1;i<=31;i++){const n=String(i).padStart(2,'0');const o=make('option','',i+'일');o.value=n;day.append(o)}render()}catch(e){console.error(e);count.textContent='메시지를 불러오지 못했어요.';chat.replaceChildren(make('div','empty','messages.csv 파일과 코드를 확인해 주세요.'))}}
search.addEventListener('input',render);year.addEventListener('change',render);month.addEventListener('change',render);day.addEventListener('change',render);load();
</script>
</body>
</html>
